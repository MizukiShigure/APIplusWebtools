<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Internal API Batch Console</title>
  <link rel="stylesheet" href="./styles.css?v=release-20260921-history-performance">
</head>
<body>
  <div id="app"></div>

  <dialog id="assetDialog" class="modal">
    <form method="dialog" class="modal-panel">
      <div class="asset-dialog-toolbar">
        <div class="modal-head">
          <h2>选择历史上传素材</h2>
          <button class="ghost-button" value="cancel" type="submit">关闭</button>
        </div>
        <div class="asset-filter">
          <button class="filter-chip active" data-filter="image" type="button">图片</button>
          <button class="filter-chip" data-filter="video" type="button">视频</button>
          <button class="filter-chip" data-filter="audio" type="button">音频</button>
          <button class="filter-chip" data-filter="other" type="button">其他</button>
          <button id="assetFavoritesOnly" class="filter-chip" type="button" aria-pressed="false">仅看收藏</button>
        </div>
      </div>
      <div id="assetDialogGrid" class="asset-grid asset-dialog-grid"></div>
    </form>
  </dialog>

  <dialog id="pasteDialog" class="modal">
    <form method="dialog" class="modal-panel">
      <div class="modal-head">
        <h2>批量粘贴 Prompt</h2>
        <button class="ghost-button" value="cancel" type="submit">关闭</button>
      </div>

      <section class="batch-defaults">
        <div class="batch-default-grid">
          <label class="field">
            <span>模型</span>
            <select id="batchModel"></select>
          </label>
          <label class="field">
            <span>模型版本</span>
            <select id="batchVersion"></select>
          </label>
          <label class="field">
            <span>尺寸</span>
            <select id="batchSize"></select>
          </label>
          <label class="field">
            <span>清晰度</span>
            <select id="batchQuality"></select>
          </label>
          <label class="field" hidden>
            <span>渲染质量</span>
            <select id="batchRenderQuality"></select>
          </label>
          <label class="field" hidden>
            <span>背景</span>
            <select id="batchBackground"></select>
          </label>
          <label class="field" hidden>
            <span>输出格式</span>
            <select id="batchOutputFormat"></select>
          </label>
          <label class="field" hidden>
            <span>GIF 帧尺寸</span>
            <select id="batchFrameSize"></select>
          </label>
          <label class="field" hidden>
            <span>GIF 帧数</span>
            <input id="batchFrameCount" type="number" min="2" max="16" step="1" value="9">
          </label>
          <label class="field" hidden>
            <span>每帧时长 (ms)</span>
            <input id="batchFrameDurationMs" type="number" min="20" max="2000" step="10" value="200">
          </label>
          <label class="field">
            <span>一次生成数量</span>
            <input id="batchCount" type="number" min="1" step="1" value="1">
          </label>
        </div>

        <div class="batch-image-defaults">
          <div class="batch-default-title">统一图片</div>
          <div id="batchImageDrop" class="image-drop batch-image-drop" tabindex="0" title="点击这里后按 Ctrl+V 可粘贴截图或复制的图片">
            <span class="empty-drop">批量生成行会统一带上这里的图片</span>
          </div>
          <div class="picker-actions">
            <button id="batchChooseAssets" class="tiny-button" type="button">选择</button>
            <button id="batchCopyImages" class="tiny-button" type="button" disabled>复制</button>
            <label class="tiny-button file-button">
              上传
              <input id="batchUploadImages" type="file" accept="image/*" multiple>
            </label>
            <button id="batchPasteImages" class="tiny-button" type="button">粘贴</button>
            <button id="batchClearImages" class="tiny-button" type="button">清空</button>
          </div>
        </div>
      </section>

      <div class="paste-help">
        <strong>推荐格式：每条用 &lt;&lt;&lt;PROMPT 编号 和 PROMPT&gt;&gt;&gt; 包起来，Prompt 内部可以自由换行。</strong>
        <span>也支持直接粘贴 MinimaxHUB 表格、CSV/TSV 表格，系统会自动识别标题含 Prompt/提示词的列；都不符合时才按每行一条处理。</span>
      </div>
      <textarea id="pasteText" rows="12" placeholder="&lt;&lt;&lt;PROMPT 001
这里写第一条 Prompt，可以包含多行。
PROMPT&gt;&gt;&gt;

&lt;&lt;&lt;PROMPT 002
这里写第二条 Prompt。
PROMPT&gt;&gt;&gt;"></textarea>
      <div class="dialog-actions">
        <button id="confirmPasteBtn" class="button primary" value="default" type="button">生成行</button>
      </div>
    </form>
  </dialog>

  <link rel="stylesheet" href="./prompt-library.css?v=release-20260914-models-prompts-performance">
  <script src="./prompt-library.js?v=release-20260914-models-prompts-performance"></script>
  <script src="./prompt-library-panel.js?v=release-20260914-models-prompts-performance"></script>
  <script src="./model-contracts.js?v=update-20261115-image-models"></script>
  <script src="./prompt-detail-utils.js?v=release-20260730-prompt-editor"></script>
  <script src="./history-origin-utils.js?v=release-20260801-origin-history"></script>
  <script src="./asset-history-utils.js?v=release-20260803-asset-picker-favorites-dedup"></script>
  <script src="./agent-task-adapter.js?v=update-20261115-image-models"></script>
  <script src="./agent-runtime.js?v=release-20260914-models-prompts-performance"></script>
  <link rel="stylesheet" href="./avatar-workflow-ui.css?v=20260921-avatar-header">
  <script src="./runninghub-shared.js?v=20260920-avatar-workflow"></script>
  <script src="./avatar-workflow-production.js?v=20260921-avatar-tabs"></script>
  <script src="./avatar-workflow-ui.js?v=20260921-avatar-header"></script>
  <link rel="stylesheet" href="./audio-workbench-ui.css?v=20261023">
  <script src="./audio-models.js?v=20261023"></script>
  <script src="./workbench-browser-client.js?v=20261023"></script>
  <script src="./audio-workbench-ui.js?v=20261023"></script>
  <script src="./app.js?v=update-20261118-local-gateway"></script>
</body>
</html>
